target: model.stage1_model.ControlLDM
params:
  linear_start: 0.00085
  linear_end: 0.012
  num_timesteps_cond: 1
  log_every_t: 200
  timesteps: 1000
  first_stage_key: jpg
  cond_stage_key: txt
  control_key: hint
  add_steps: 200
  image_size: 64
  channels: 4
  cond_stage_trainable: false
  conditioning_key: crossattn
  monitor: val/loss_simple_ema
  scale_factor: 0.18215
  use_ema: false
  sync_path: null
  synch_control: true
  ckpt_path_pre: null
  sd_locked: true
  learning_rate: 0.0001
  aux_learning_rate: 0.001
  l_simple_weight: 1.0
  l_guide_weight: 1.0
  l_bpp_weight: 6.0
  control_stage_config:
    target: model.stage1_model.CDDM
    params:
      use_checkpoint: true
      image_size: 32
      in_channels: 4
      out_channels: 4
      hint_channels: 4
      model_channels: 320
      attention_resolutions:
      - 4
      - 2
      - 1
      num_res_blocks: 2
      channel_mult:
      - 1
      - 2
      - 4
      - 4
      num_head_channels: 16
      use_spatial_transformer: true
      use_linear_in_transformer: true
      transformer_depth: 1
      context_dim: 1024
      legacy: false
      control_scale: 1.0
      control_model_ratio: 0.2
  unet_config:
    target: ldm.modules.diffusionmodules.openaimodel.UNetModel
    params:
      use_checkpoint: true
      image_size: 32
      in_channels: 4
      out_channels: 4
      model_channels: 320
      attention_resolutions:
      - 4
      - 2
      - 1
      num_res_blocks: 2
      channel_mult:
      - 1
      - 2
      - 4
      - 4
      num_head_channels: 64
      use_spatial_transformer: true
      use_linear_in_transformer: true
      transformer_depth: 1
      context_dim: 1024
      legacy: false
  first_stage_config:
    target: ldm.models.autoencoder.AutoencoderKL
    params:
      embed_dim: 4
      monitor: val/rec_loss
      ddconfig:
        double_z: true
        z_channels: 4
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult:
        - 1
        - 2
        - 4
        - 4
        num_res_blocks: 2
        attn_resolutions: []
        dropout: 0.0
      lossconfig:
        target: torch.nn.Identity
  cond_stage_config:
    target: ldm.modules.encoders.modules.FrozenOpenCLIPEmbedder
    params:
      freeze: true
      layer: penultimate
  preprocess_config:
    target: model.compressor.ELIC
    params:
      in_nc: 4
      enc_mid:
      - 64
      - 128
      - 128
      out_nc: 4
      'N': 128
      M: 192
      slice_num: 5
      slice_ch:
      - 16
      - 16
      - 32
      - 32
      - 96
  calculate_metrics:
    psnr:
      type: psnr
      crop_border: 0
      test_y_channel: false
    ms_ssim:
      type: ms_ssim
      test_y_channel: false
    lpips:
      type: lpips
      better: lower
