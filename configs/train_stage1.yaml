model:
  config: configs/model/stage1/rate1.yaml
lightning:
  trainer:
    accelerator: gpu
    devices: 1
    strategy: ddp
    precision: 32
    default_root_dir: ./outputs/stage1
    max_steps: 100001
    log_every_n_steps: 100
    accumulate_grad_batches: 1
  callbacks:
  - target: model.callbacks.ImageLogger
    params:
      log_every_n_steps: 1000
      log_start_step: 0
      max_images_each_step: 2
      log_images_kwargs: null
  - target: model.callbacks.ModelCheckpoint
    params:
      every_n_train_steps: 10000
      save_top_k: -1
      filename: '{step}'
